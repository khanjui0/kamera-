name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Test and build release APK
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk KayipBulucu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KayipBulucu-apk
          path: KayipBulucu.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kayıp Bulucu (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: Telefonuna KayipBulucu.apk dosyasını indirip kur.
          files: KayipBulucu.apk
